@let t = i18n.t();

<section class="hero" id="home">
  <div class="hero-card card">
    <h1 class="hero-name">{{ t.home.name }}</h1>

    <p class="hero-tagline">{{ t.home.tagline }}</p>

    <p class="hero-roles" [attr.aria-label]="t.home.roles[0]">
      <span>{{ typed }}</span><span class="hero-caret" aria-hidden="true"></span>
    </p>
  </div>
</section>
